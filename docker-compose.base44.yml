services:
  # ── Infrastructure ──────────────────────────────────────────────
  postgres:
    image: postgres:15.4
    environment:
      POSTGRES_DB: faceless_autopilot_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tjq5uxt3
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  redis:
    image: redis:7.2-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  # ── Backend microservices (FastAPI, live-reload) ────────────────
  ai-content:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./services/ai-content:/app
      - pip_cache_ai:/root/.cache/pip
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql://postgres:tjq5uxt3@postgres:5432/faceless_autopilot_ai
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=dev-secret-key-not-for-production
    command: ["sh", "-ec", "pip install -q -r requirements.txt && exec uvicorn app.main:app --reload --host 0.0.0.0 --port 8561"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8561/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  platform-apis:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./services/platform-apis:/app
      - pip_cache_platform:/root/.cache/pip
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql://postgres:tjq5uxt3@postgres:5432/faceless_autopilot_ai
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=dev-secret-key-not-for-production
    command: ["sh", "-ec", "pip install -q -r requirements.txt && exec uvicorn app.main:app --reload --host 0.0.0.0 --port 8562"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8562/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  analytics:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./services/analytics:/app
      - pip_cache_analytics:/root/.cache/pip
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql://postgres:tjq5uxt3@postgres:5432/faceless_autopilot_ai
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=dev-secret-key-not-for-production
    command: ["sh", "-ec", "pip install -q -r requirements.txt && exec uvicorn app.main:app --reload --host 0.0.0.0 --port 8563"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8563/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Frontend (Next.js dev, port 3000) ───────────────────────────
  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./faceless-frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - NEXT_PUBLIC_AI_CONTENT_URL=/svc/ai-content
      - NEXT_PUBLIC_PLATFORM_APIS_URL=/svc/platform-apis
      - NEXT_PUBLIC_ANALYTICS_URL=/svc/analytics
    command: ["sh", "-ec", "corepack enable && corepack prepare pnpm@9 --activate && pnpm install --frozen-lockfile && exec pnpm exec next dev -p 3000 -H 0.0.0.0"]
    depends_on:
      - ai-content
      - platform-apis
      - analytics
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');http.get('http://localhost:3000',r=>{process.exit(r.statusCode<400?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  pip_cache_ai:
  pip_cache_platform:
  pip_cache_analytics:
  frontend_node_modules:
